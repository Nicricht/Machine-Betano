name: Actualizacion automatica de datos de futbol

on:
  schedule:
    - cron: "17 8,14,23 * * *"
      timezone: "America/Santiago"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "datasets/actualizados/**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: machine-betano-datos-actualizados
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias del modelo 1X2
        run: python -m pip install -r requirements-model.txt
      - name: Probar normalizacion y reglas de integridad
        run: python -m unittest discover -s tests -p "test_live_refresh.py" -v
      - name: Descargar partidos de LaLiga y Bundesliga
        run: python scripts/refresh_openligadb.py
      - name: Pruebas de features sin fuga temporal
        run: python -m unittest discover -s tests -p "test_live_features.py" -v
      - name: Calcular features prepartido para ambas ligas
        run: python scripts/build_live_features.py
      - name: Probar carga de temporadas anteriores
        run: python -m unittest discover -s tests -p "test_historical_backfill.py" -v
      - name: Recuperar temporadas historicas 2024 y 2025 solo si faltan
        id: historical
        continue-on-error: true
        run: python -m scripts.historical_backfill
      - name: Documentar falta de cobertura historica si sucede
        if: steps.historical.outcome == 'failure'
        run: echo "Historico OpenLigaDB no disponible en la consulta; se conserva el modelo con datos actuales." >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar historico de fuente ODbL
        if: steps.historical.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: machine-betano-historico-openligadb
          path: datasets/historicos/
          if-no-files-found: error
          retention-days: 90
      - name: Probar extraccion de goleadores y autogoles
        run: python -m unittest discover -s tests -p "test_scorer_summary.py" -v
      - name: Exportar resumen observado de goleadores
        run: python -m scripts.build_scorer_summary
      - name: Probar modelo 1X2 con corte cronologico
        run: python -m unittest discover -s tests -p "test_live_model.py" -v
      - name: Evaluar 1X2 y generar probabilidades exploratorias
        id: train_1x2
        continue-on-error: true
        run: python -m scripts.train_live_1x2
      - name: Publicar informe exploratorio del modelo
        if: steps.train_1x2.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: machine-betano-modelo-1x2
          path: outputs/modelo_actual/
          if-no-files-found: error
          retention-days: 90
      - name: Informar falta de datos para entrenar cuando corresponda
        if: steps.train_1x2.outcome == 'failure'
        run: |
          echo "Modelo 1X2: no se pudo entrenar/evaluar con la muestra disponible. Las tablas deportivas siguen actualizándose; revisar logs." >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar snapshot de CSV en artefacto
        uses: actions/upload-artifact@v4
        with:
          name: machine-betano-actualizado
          path: datasets/actualizados/
          if-no-files-found: error
          retention-days: 90
      - name: Confirmar cambio de datos en repositorio
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/actualizados
          if test -d datasets/historicos; then
            git add datasets/historicos
          fi
          if git diff --cached --quiet; then
            echo "Sin cambios; fuente consultada correctamente"
          else
            git commit -m "data: refrescar LaLiga y Bundesliga desde OpenLigaDB"
            git push origin HEAD:main
          fi
