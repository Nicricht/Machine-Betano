[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-betano"
version = "0.1.0"
description = "Exploración reproducible de datos históricos de fútbol"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.3,<2",
    "joblib>=1.3,<2"
]

[project.scripts]
machine-betano = "machine_betano.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
